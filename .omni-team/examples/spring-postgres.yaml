# =============================================================================
# Example manifest: Spring Boot 3 + Postgres + Flyway (no FE in this repo)
# =============================================================================
# Use case: Java backend monolith using Spring Boot, Spring Data JPA, Flyway
# migrations. Demonstrates that omni-team's templates are language-agnostic —
# no Python/JS assumptions leak into the rendered agents.
#
# Differences vs the FastAPI starter:
# - `backend.activate_cmd: ""` (no venv — Maven/Gradle wrap the JVM directly)
# - Flyway SQL migrations under `src/main/resources/db/migration`
# - JPA repositories instead of hand-rolled repo layer
# - `@ControllerAdvice` + `ErrorResponse` DTO instead of FastAPI exception class
# - `@Transactional` boundary on service layer instead of explicit commit()
# - No first-party frontend (Thymeleaf or external SPA assumed)
# =============================================================================

project:
  name: Example Spring Service
  short_name: example-spring
  description: |
    Spring Boot 3.3 + Java 21 backend monolith. Postgres 16 via Spring Data JPA.
    Flyway for migrations. No first-party frontend in this repo.

work_unit_label: Story
work_unit_example_id: "STORY-42"
spec_root: docs/stories/
artifact_dir: docs/stories/{mp_id}/agent-pow
post_qa_lead_gate_label: "code review + merge"

models:
  tech_lead: opus
  backend_reviewer: sonnet
  frontend_reviewer: sonnet      # unused but required by template
  dba: sonnet
  qa_engineer: sonnet
  qa_lead: opus
  perf_engineer: sonnet
  security_engineer: sonnet
  ui_smoke_engineer: sonnet      # unused

quality_limits:
  file_lines: 500
  function_lines: 80
  function_params: 8
  nesting_depth: 4

# -----------------------------------------------------------------------------
backend:
  framework: Spring Boot 3
  language: java
  # Maven wrapper drives the JVM directly — no shell prefix needed.
  activate_cmd: ""
  test_cmd: "./mvnw -q clean verify"
  dev_url: "http://localhost:8080"
  dev_port: 8080
  health_url: "http://localhost:8080/actuator/health"

  root: backend
  app_dir: backend/src/main/java/com/example/app/
  models_dir: backend/src/main/java/com/example/app/domain/
  schemas_dir: backend/src/main/java/com/example/app/dto/
  repos_dir: backend/src/main/java/com/example/app/repository/
  services_dir: backend/src/main/java/com/example/app/service/
  routers_dir: backend/src/main/java/com/example/app/controller/
  tests_dir: backend/src/test/java/com/example/app/
  tests_glob: "backend/src/test/java/**/*Test.java"
  entrypoint: backend/src/main/java/com/example/app/Application.java
  generated_files_csv: "target/, .mvn/wrapper/maven-wrapper.jar, build/"

  # JPA / Spring Data idioms — query patterns the reviewer scans for
  db_query_patterns: "repository.findBy*, repository.save, entityManager.createQuery"
  commit_call: "@Transactional boundary (no explicit commit in app code)"
  commit_exception: "Exception: batch jobs in `app/batch/` may call `EntityManager.flush()` manually."
  forbidden_sort_pattern: "Sort.by(request.getParameter(\"sort\"))  // unbounded dynamic sort"

  error_contract:
    name: ErrorResponse
    shape: '{"errorCode": "...", "message": "...", "timestamp": "..."}'
    location: "backend/src/main/java/com/example/app/web/ErrorResponse.java"

  soft_delete:
    mixin: SoftDeletable (interface) + @SQLDelete on entity
    column: deleted_at
    live_filter: "@Where(clause = \"deleted_at IS NULL\")"

  framework_version_idioms_md: |
    Spring Boot 3.x / Jakarta EE 10:
      - imports must be `jakarta.*` not `javax.*` (3.0 migration).
      - Validation: `jakarta.validation.constraints.*` not `javax.validation.*`.
      - JPA: `jakarta.persistence.*` not `javax.persistence.*`.
    Java 21 idioms:
      - prefer records over POJO DTOs.
      - prefer `var` for obvious local types; explicit for ambiguous returns.
      - prefer pattern matching `switch` over `instanceof` chains.

  layer_rules_md: |
    - Layer order: `domain (entity) → repository (JPA) → service → controller → register in Application.java auto-scan`.
    - Flow direction: `controller → service → repository`. Reverse forbidden.
    - Controllers: `@RestController` + Bean Validation → call service → return DTO. No JPA, no business logic.
    - Services: `@Service` + `@Transactional` on write methods. No HTTP, no JPA queries (delegate to repository).
    - Repositories: `extends JpaRepository<T, ID>` or `@Repository`. No commit (handled by `@Transactional`), no business logic.

  async_pitfalls_md: |
    Blocking calls in reactive paths (`Mono`/`Flux`): `RestTemplate`, `Thread.sleep`, JDBC.
    For sync controllers these are fine. Watch for `@Async` methods that swallow exceptions
    without `CompletableFuture.exceptionally(...)`.

# -----------------------------------------------------------------------------
frontend:
  framework: ""                # empty = disabled, FE agents will skip
  language: ""
  activate_cmd: ""
  test_cmd: ""
  dev_url: ""
  stack_up_cmd: ""
  root: ""
  app_dir: ""
  components_dir: ""
  feature_module_path: ""
  hooks_pattern_path: ""
  wireframe_dir: ""
  locales: ["en"]
  locales_csv: "en"
  i18n_hook: ""
  i18n_call: ""
  i18n_call_regex: ""
  locale_files_md: "(none)"
  ui_library: ""
  proxy_helper: ""
  proxy_helper_path: ""
  proxy_exceptions_md: "(none)"
  source_extensions_csv: ""
  generated_files_csv: ""
  test_files_note: ""
  browser_mcp: ""
  browser_mcp_tools: ""
  review_exemptions_md: "(none)"

# -----------------------------------------------------------------------------
database:
  engine: postgres
  migrations:
    tool: flyway
    # Path is REPO-root-relative (used by orchestrator.py to detect schema changes in git diff).
    versions_dir: backend/src/main/resources/db/migration/
    # Flyway has no "generate" command — print the next filename to create by hand.
    # Uses `bash -c '...' _` so the template's trailing "$ARGUMENTS" is bound to $1.
    cmd_new: 'bash -c ''d=src/main/resources/db/migration; n=$(ls $d/V*.sql 2>/dev/null | sed "s|.*V\([0-9]*\)__.*|\1|" | sort -n | tail -1); echo "Create: $d/V$((${n:-0}+1))__${1// /_}.sql"'' _'
    cmd_up: "./mvnw -q flyway:migrate"
    cmd_down: "echo 'Flyway Community does not support undo — write a forward-fix migration.' #"
    cmd_current: "./mvnw -q flyway:info"
    cmd_sql: "./mvnw -q flyway:info -X | grep -A20 'Migration'"

  soft_delete:
    partial_unique_clause_code: 'CREATE UNIQUE INDEX ... WHERE deleted_at IS NULL  -- in a Flyway migration'

  rls:
    file: ""

  vendor_owned_schemas_md: |
    (none) — or list vendor schemas (e.g. `pg_catalog.*`, third-party extensions) to skip.

# -----------------------------------------------------------------------------
llm:
  enabled: false
  provider: ""
  register_path_list: ""
  prompt_template_location: ""
  slow_log_ms: 5000

conventions:
  idempotency:
    helper: "IdempotencyKeyService.buildKey(...)"
    location: backend/src/main/java/com/example/app/service/IdempotencyKeyService.java

performance:
  baseline_doc: docs/PERFORMANCE.md
  cache_layer_helpers: "Spring Cache (@Cacheable) backed by Caffeine"
  tier_table_md: |
    | Tier | Threshold | Pattern |
    |------|-----------|---------|
    | A — External API | ≤ 5,000 ms | RestClient / WebClient calls to 3rd-party |
    | B — DB Complex   | ≤ 500 ms   | JPA joins, criteria queries, native SQL |
    | C — DB Simple    | ≤ 150 ms   | Simple repository.findById / save |
    | D — Cache hit    | ≤ 50 ms    | @Cacheable hit, /actuator/health |

security:
  trigger_paths_md: |
    - `backend/src/main/java/**/security/` (Spring Security config, filters)
    - `backend/src/main/java/**/auth/` (login, JWT, refresh)
    - `backend/src/main/resources/application*.yml` (secrets, DB creds, OAuth client)
  pii_fields_csv: "email, phone, ssn, paymentMethod"
  pii_log_keywords_csv: "`email`, `password`, `phone`, `ssn`, `token`, `jwt`, `cookie`, `Authorization`"
  cookie_flags_required_csv: "HttpOnly + SameSite=Lax"
  cookie_prod_extra: ", and in production `Secure`"
  auth_guard_helpers: "`@PreAuthorize(\"isAuthenticated()\")` or `SecurityContextHolder.getContext().getAuthentication()`"
  pii_storage_pattern_md: |
    Encrypt PII columns with `@ColumnTransformer` (Postgres `pgcrypto`).
    Hash emails into `email_hash` for case-insensitive lookups.

cross_cutting_invariants_md: |
  - **Soft-delete invariant**: every `@SoftDeletable` entity query is filtered by `@Where(clause = "deleted_at IS NULL")`.
  - **Error envelope**: every `@RestController` exception routes through `@ControllerAdvice` and emits `ErrorResponse`.
  - **Transactional boundary**: every write method on a `@Service` is `@Transactional`; controllers never start transactions.
  - **Flyway-only schema changes**: schema is mutated only via files in `src/main/resources/db/migration/V{n}__{desc}.sql`. JPA `ddl-auto` is `validate` in prod.
  - **Idempotent side effects**: any external API call or fire-and-forget `@Async` job needs an idempotency key from `IdempotencyKeyService`.

design_docs_list: |
  - `docs/ARCHITECTURE.md` — service boundaries, package layout.
  - `docs/DOMAIN.md` — aggregate roots and invariants.
  - `docs/SECURITY.md` — JWT/refresh flow, RBAC model.

phased_plan_template_md: |
  #### Phase 1 — Schema
  - [ ] `backend/src/main/resources/db/migration/V{n}__<desc>.sql` — DDL only
  - [ ] `backend/src/main/java/.../domain/<Entity>.java` — JPA entity matching the new schema

  #### Phase 2 — DTOs
  - [ ] `backend/src/main/java/.../dto/<Feature>Request.java` (record + Bean Validation annotations)
  - [ ] `backend/src/main/java/.../dto/<Feature>Response.java`

  #### Phase 3 — Repository
  - [ ] `backend/src/main/java/.../repository/<Entity>Repository.java` — `extends JpaRepository<...>`

  #### Phase 4 — Service
  - [ ] `backend/src/main/java/.../service/<Feature>Service.java` — `@Service`, `@Transactional` on writes

  #### Phase 5 — Controller
  - [ ] `backend/src/main/java/.../controller/<Feature>Controller.java` — `@RestController`, validation, auth

  #### Phase 6 — Tests
  - [ ] `backend/src/test/java/.../<Feature>ServiceTest.java` — JUnit 5 + `@MockBean`
  - [ ] `backend/src/test/java/.../<Feature>ControllerTest.java` — `@WebMvcTest` slice

llm_specific_planning_md: "(none)"

qa_lead:
  frontend_tests_clause: ""

project_rules:
  backend_reviewer:
    critical_md: |
      - **No `javax.*` imports** — Spring Boot 3 requires `jakarta.*`. Flag any `javax.persistence`, `javax.validation`, `javax.servlet` usage.
      - **No raw `EntityManager.persist` in services** — use the repository layer for traceability.
      - **No `@Transactional` on controllers** — boundary must live on the service.
    warning_md: |
      - **Constructor injection only** — `@Autowired` field injection is discouraged.
      - **`Optional<T>` return type for `findBy*`** — never return `null`.

  frontend_reviewer: { critical_md: "(none — no FE in this repo)", warning_md: "(none)" }

  dba:
    lessons_md: |
      > **Flyway migrations are immutable once shipped**. To change applied DDL, write a NEW
      > `V{n+1}__fix_<thing>.sql`. Never edit an existing `V{n}__*.sql` that has been merged.
    critical_md: |
      - **No `ddl-auto: update` in committed `application*.yml`** — must be `validate` (prod) or `none`.
      - **Every new column on an existing table** must specify `DEFAULT` or be nullable, to avoid table rewrites on large tables.
    warning_md: |
      - **Index review** — every new `WHERE` / `ORDER BY` column should have an index. Call it out if missing.

  qa_engineer:
    p0_md: |
      - **Service-layer tests are mandatory** — use `@MockBean` for repositories, assert business logic.
      - **Controller slice tests with `@WebMvcTest`** for new endpoints — assert status, response shape, auth.

  qa_lead:
    smoke_checks_md: |
      - **`./mvnw verify` passes locally** (compile + unit + integration tests + spotbugs/checkstyle if configured).
      - **Actuator `/health` returns UP** after stack-up.

  perf_engineer:
    rules_md: |
      - **N+1 detection** — flag `@OneToMany` / `@ManyToOne` accessed in a loop without `JOIN FETCH` or `@EntityGraph`.
      - **Pagination** — list endpoints must return `Page<T>` (Spring Data) or accept `limit`/`offset` with bounded max.

  security_engineer:
    rules_md: |
      - **Spring Security filter chain** — every new controller path must match a rule in `SecurityConfig`. Default-deny.
      - **CSRF**: state-changing endpoints behind cookie auth must have CSRF enabled, or be explicitly stateless+JWT.
      - **Method security** — `@PreAuthorize` on every method exposed via `@RestController` unless covered by URL-level rules.

# -----------------------------------------------------------------------------
decision_matrix:
  base:
    - name: trivial
      when: { loc_max: 20 }
      agents: []
    - name: bug-fix
      when: { loc_max: 100, stacks: ["backend"], schema_change: false }
      agents: ["backend-reviewer"]
    - name: new-endpoint
      when: { loc_max: 500, stacks: ["backend"], new_route: true, schema_change: false }
      agents: ["qa-engineer", "backend-reviewer", "perf-engineer"]
    - name: schema-change
      when: { loc_max: 800, stacks: ["backend"], schema_change: true }
      agents: ["dba", "qa-engineer", "backend-reviewer", "perf-engineer"]
    - name: default
      when: { loc_max: 999999 }
      agents: ["tech-lead", "qa-engineer", "backend-reviewer", "qa-lead"]

  add_if:
    - name: security-sensitive
      when:
        path_globs:
          - "**/security/**"
          - "**/auth/**"
          - "**/application*.yml"
        keywords: ["password", "token", "jwt", "secret", "api_key", "Authorization"]
        pii_fields: ["email", "phone", "ssn"]
      agents_add: ["security-engineer"]

# -----------------------------------------------------------------------------
orchestrator:
  retry_budget:
    block_max: 3
    request_changes_max: 5
  spawn_mode: subprocess
  claude_cmd: claude
  state_file_pattern: docs/stories/{mp_id}/agent-pow/_state.json
  final_human_gate: "code review + merge"

# =============================================================================
# Claude Code configuration
# =============================================================================
claude_code:
  enabled_mcps: []

  post_tool_use_hooks_md: |
    - matcher: "backend/src/main/resources/db/migration/V*.sql"
      reason: "Applied Flyway migrations are immutable. Create a new V{n+1}__*.sql instead."
    - matcher: "backend/src/main/resources/application*.yml"
      reason: "Config changes can leak secrets — confirm no plaintext credentials and that prod profile keeps ddl-auto=validate."

  stop_hook_reminder: "Reminder: run /test-be before declaring done."

  permissions_allow_list: |
    Bash(ls:*), Bash(rg:*), Bash(./mvnw:*), Bash(mvn:*)

# Note: command files are rendered from templates/commands/*.md using {{backend.test_cmd}},
# {{backend.activate_cmd}}, and {{database.migrations.cmd_*}} — no `commands:` block here.
