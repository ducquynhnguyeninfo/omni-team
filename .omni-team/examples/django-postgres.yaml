# Example manifest: Django + Postgres + Django REST Framework (no FE in this repo)
# Use case: backend monolith. UI lives elsewhere or is server-rendered templates.
#
# Differences vs the starter:
# - No frontend block (set framework: "" to disable FE agents)
# - django-migrations instead of alembic
# - No soft-delete mixin (Django default = hard delete; comment out the rule if not used)
# - DRF exception handler instead of LeanApiError
# - RLS not used; rely on app-layer permission classes

project:
  name: Example Django Service
  short_name: example-django
  description: |
    Django 5 + DRF backend monolith. Postgres 15. No first-party frontend.

work_unit_label: Story
work_unit_example_id: "STORY-42"
spec_root: docs/stories/
artifact_dir: docs/stories/{mp_id}/agent-pow
post_qa_lead_gate_label: "code review + merge"

models:
  tech_lead: opus
  backend_reviewer: sonnet
  frontend_reviewer: sonnet      # unused but required by template
  dba: sonnet
  qa_engineer: sonnet
  qa_lead: opus
  perf_engineer: sonnet
  security_engineer: sonnet
  ui_smoke_engineer: sonnet      # unused

quality_limits:
  file_lines: 500
  function_lines: 80
  function_params: 8
  nesting_depth: 4

backend:
  framework: Django + DRF
  language: python
  activate_cmd: "source .venv/bin/activate &&"
  test_cmd: "ruff check . && pytest -q"
  dev_url: "http://localhost:8000"
  dev_port: 8000
  health_url: "http://localhost:8000/health/"

  root: backend
  app_dir: backend/apps/
  models_dir: backend/apps/<feature>/models.py
  schemas_dir: backend/apps/<feature>/serializers.py
  repos_dir: backend/apps/<feature>/repositories.py
  services_dir: backend/apps/<feature>/services.py
  routers_dir: backend/apps/<feature>/views.py
  tests_dir: backend/tests/
  tests_glob: "backend/tests/test_*.py"
  entrypoint: backend/config/urls.py
  generated_files_csv: "migrations/, settings/generated.py"

  db_query_patterns: ".objects.filter, .objects.get, .raw("
  commit_call: "transaction.atomic() commit / manual save()"
  commit_exception: ""
  forbidden_sort_pattern: "Model._meta.get_field(client_input)"

  error_contract:
    name: DRF Exception Handler envelope
    shape: '{"code": "...", "detail": "..."}'
    location: "backend/config/exceptions.py"

  soft_delete:
    mixin: SoftDeleteModel
    column: deleted_at
    live_filter: ".filter(deleted_at__isnull=True)"

  framework_version_idioms_md: |
    Django ≥4.2 idioms: prefer `models.JSONField` over `django_jsonfield_backport`;
    prefer `cached_property` over `@property` for expensive computations.

  layer_rules_md: |
    - View → Service → Repository → Model.
    - Views: parse + serialize only; never call ORM directly.
    - Services: orchestrate transactions (`transaction.atomic()`); no HTTP concerns.
    - Repositories: ORM queries only; return querysets or domain objects.

  async_pitfalls_md: |
    Blocking I/O (requests, file I/O) is fine — Django views are sync by default.
    Async views must use `httpx.AsyncClient`, not `requests`.

frontend:
  framework: ""                # empty = disabled, FE agents will skip
  language: ""
  test_cmd: ""
  dev_url: ""
  stack_up_cmd: ""
  root: ""
  app_dir: ""
  components_dir: ""
  feature_module_path: ""
  hooks_pattern_path: ""
  wireframe_dir: ""
  locales: ["en"]
  locales_csv: "en"
  i18n_hook: ""
  i18n_call: ""
  i18n_call_regex: ""
  locale_files_md: "(none)"
  ui_library: ""
  proxy_helper: ""
  proxy_helper_path: ""
  proxy_exceptions_md: "(none)"
  source_extensions_csv: ""
  generated_files_csv: ""
  test_files_note: ""
  browser_mcp: ""
  browser_mcp_tools: ""
  review_exemptions_md: "(none)"

database:
  engine: postgres
  migrations:
    tool: django-migrate
    versions_dir: backend/apps/*/migrations/
    cmd_new: 'python manage.py makemigrations'
    cmd_up: "python manage.py migrate"
    cmd_down: "python manage.py migrate <app> <prev_migration>"
    cmd_current: "python manage.py showmigrations"
    cmd_sql: "python manage.py sqlmigrate <app> <number>"

  soft_delete:
    partial_unique_clause_code: 'UniqueConstraint(condition=Q(deleted_at__isnull=True), ...)'

  rls:
    file: ""

  vendor_owned_schemas_md: |
    (none)

llm:
  enabled: false
  provider: ""
  register_path_list: ""
  prompt_template_location: ""
  slow_log_ms: 5000

conventions:
  idempotency:
    helper: "build_idempotency_key (in apps/core/idempotency.py)"
    location: backend/apps/core/idempotency.py

performance:
  baseline_doc: docs/PERFORMANCE.md
  cache_layer_helpers: "redis_cache_get / redis_cache_set"
  tier_table_md: |
    | Tier | Threshold | Pattern |
    |------|-----------|---------|
    | A — External API | ≤ 5,000 ms | 3rd-party HTTP |
    | B — DB Complex | ≤ 500 ms | Joins, aggregations |
    | C — DB Simple | ≤ 150 ms | Simple CRUD |
    | D — Cache hit | ≤ 50 ms | Redis lookup |

security:
  trigger_paths_md: |
    - `backend/apps/accounts/` (auth)
    - `backend/config/settings/` (secrets / SECRET_KEY)
    - `backend/apps/core/middleware/` (sessions, CSRF)
  pii_fields_csv: "email, phone, ssn, payment_method"
  pii_log_keywords_csv: "`email`, `password`, `phone`, `ssn`, `token`, `session_id`"
  cookie_flags_required_csv: "HttpOnly + SameSite=Lax"
  cookie_prod_extra: ", and in production `Secure`"
  auth_guard_helpers: "`@permission_classes([IsAuthenticated])` or `request.user.is_authenticated` check"
  pii_storage_pattern_md: |
    Encrypt SSN with `django-fernet-fields`. Hash emails for lookup index.

cross_cutting_invariants_md: |
  - **Soft-delete invariant**: every `SoftDeleteModel` query filters `deleted_at__isnull=True`.
  - **Error envelope**: DRF custom exception handler wraps every error in `{code, detail}`.
  - **Atomic mutations**: every multi-step mutation wraps in `transaction.atomic()`.
  - **Idempotent side effects**: external API calls require an idempotency key.

design_docs_list: |
  - `docs/ARCHITECTURE.md`
  - `docs/DOMAIN.md`

phased_plan_template_md: |
  #### Phase 1 — Models + Migration
  #### Phase 2 — Serializers
  #### Phase 3 — Repository
  #### Phase 4 — Service
  #### Phase 5 — Views + URLs
  #### Phase 6 — Tests
  #### Phase 7 — Admin registration (if applicable)

llm_specific_planning_md: "(none)"

qa_lead:
  frontend_tests_clause: ""

project_rules:
  backend_reviewer: { critical_md: "(none)", warning_md: "(none)" }
  frontend_reviewer: { critical_md: "(none)", warning_md: "(none)" }
  dba: { lessons_md: "(none)", critical_md: "(none)", warning_md: "(none)" }
  qa_engineer: { p0_md: "(none)" }
  qa_lead: { smoke_checks_md: "(none)" }
  perf_engineer: { rules_md: "(none)" }
  security_engineer:
    rules_md: |
      - Django CSRF token must be present on every state-changing form.
      - `SECRET_KEY` rotation is OPS-only; never commit to repo.

decision_matrix:
  base:
    - name: trivial
      when: { loc_max: 20 }
      agents: []
    - name: bug-fix
      when: { loc_max: 100 }
      agents: ["backend-reviewer"]
    - name: new-endpoint
      when: { loc_max: 500, new_route: true }
      agents: ["qa-engineer", "backend-reviewer", "perf-engineer"]
    - name: schema-change
      when: { schema_change: true }
      agents: ["dba", "qa-engineer", "backend-reviewer", "perf-engineer"]
    - name: default
      when: { loc_max: 999999 }
      agents: ["tech-lead", "qa-engineer", "backend-reviewer", "qa-lead"]

  add_if:
    - when:
        path_globs: ["backend/apps/accounts/**", "backend/config/settings/**"]
        keywords: ["password", "token", "secret", "SECRET_KEY"]
      agents_add: ["security-engineer"]

orchestrator:
  retry_budget:
    block_max: 3
    request_changes_max: 5
  spawn_mode: subprocess
  claude_cmd: claude
  state_file_pattern: docs/stories/{mp_id}/agent-pow/_state.json
  final_human_gate: "code review + merge"

claude_code:
  enabled_mcps: []
  post_tool_use_hooks_md: |
    - matcher: "backend/apps/*/migrations/*.py"
      reason: "Applied Django migrations are immutable. Run `python manage.py makemigrations` for a new one."
  stop_hook_reminder: "Reminder: run /test-be (ruff check + pytest) before declaring done."
  permissions_allow_list: |
    Bash(ls:*), Bash(rg:*), Bash(python manage.py:*), Bash(pytest:*), Bash(ruff:*)
