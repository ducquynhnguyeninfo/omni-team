# =============================================================================
# omni-team framework defaults — DATA, not code. Owned by the framework.
# =============================================================================
# Do not edit this file for one project: override any top-level key in
# project/profile.yaml instead (see docs/profile.md §merge-rules). Keeping this
# file pristine lets you upgrade omni-team by replacing everything except
# project/ and runs/.
# =============================================================================

artifacts_dir: .omni-team/runs/{task_id}
human_gate: "Human review (optionally a second-tool cross-check) → manual commit / push"

quality_limits:
  file_lines: 500
  function_lines: 100
  function_params: 8
  nesting_depth: 4

# -----------------------------------------------------------------------------
# Signals — named change detectors, evaluated against the diff.
# A signal is a predicate mapping (all keys must match) or a LIST of mappings
# (any one matching is enough). Predicates: see docs/routing.md.
# -----------------------------------------------------------------------------
signals:
  docs_only:
    only_paths: ["**/*.md", "**/*.mdx", "**/*.rst", "**/*.txt", "**/*.adoc",
                 "docs/**", "doc/**", "LICENSE*", "**/.gitignore", "**/CODEOWNERS"]

  ui_change:
    paths: ["**/*.tsx", "**/*.jsx", "**/*.vue", "**/*.svelte", "**/*.astro",
            "**/*.html", "**/*.htm", "**/*.css", "**/*.scss", "**/*.sass", "**/*.less",
            "**/*.erb", "**/*.haml", "**/*.slim", "**/*.blade.php", "**/*.twig",
            "**/*.cshtml", "**/*.razor", "**/*.hbs", "**/*.ejs", "**/*.njk",
            "**/*.dart", "**/*.storyboard", "**/*.xib", "**/res/layout/**",
            "**/*View.swift", "**/*Screen.kt", "**/*Screen.tsx",
            "**/messages/*.json", "**/locales/**", "**/i18n/**"]

  schema_change:
    paths: ["**/migrations/**", "**/migration/**", "**/migrate/**", "**/alembic/**",
            "**/db/changelog/**", "**/flyway/**", "**/liquibase/**", "**/Migrations/**",
            "**/*.sql", "**/schema.prisma", "**/prisma/**/*.prisma",
            "**/models/**", "**/model/**", "**/entities/**", "**/entity/**",
            "**/*.proto", "**/*.graphql", "**/*.gql", "**/*.avsc",
            "**/openapi*.y*ml", "**/openapi*.json", "**/swagger*.y*ml", "**/swagger*.json",
            "**/schema*.json", "**/*.xsd"]

  api_surface_change:
    added_lines:
      # Python (FastAPI, Flask, Starlette, Django)
      - '@\w*(app|router|api|bp|blueprint)\.(get|post|put|patch|delete|route|websocket)\('
      - '^\s*(re_)?path\(\s*r?["'']'
      # JS/TS (Express, Fastify, Koa, Hono, Next.js route handlers, tRPC)
      - '\b(app|router|server|fastify|api|route)\.(get|post|put|patch|delete|all|route)\(\s*["''`/]'
      - '^\s*export\s+(async\s+)?function\s+(GET|POST|PUT|PATCH|DELETE)\b'
      - '\b(publicProcedure|protectedProcedure)\b'
      # Java/Kotlin/C# (Spring, JAX-RS, Micronaut, NestJS-style decorators, ASP.NET)
      - '@(Get|Post|Put|Patch|Delete|Request)Mapping\b'
      - '@(Get|Post|Put|Patch|Delete|All)\(\s*["'')]'
      - '@(GET|POST|PUT|PATCH|DELETE|Path)\b'
      - '\[(Http(Get|Post|Put|Patch|Delete)|Route)\b'
      - '\.Map(Get|Post|Put|Patch|Delete)\('
      # Go, Rust, Elixir, Ruby, PHP
      - '\.(HandleFunc|Handle|GET|POST|PUT|PATCH|DELETE)\(\s*"'
      - '#\[(get|post|put|patch|delete)\('
      - '\.route\(\s*"/'
      - '^\s*(get|post|put|patch|delete|resources?|scope)\s+["'':/]'
      - 'Route::(get|post|put|patch|delete|resource|apiResource)\('
      # RPC / GraphQL / CLI surfaces
      - '^\s*rpc\s+\w+\s*\('
      - '^\s*type\s+(Query|Mutation|Subscription)\b'
      - '\b(add_parser|add_command|AddCommand|subcommand)\('
      - '@(click|app)\.command\('

  security_sensitive:
    - paths: ["**/auth/**", "**/*auth*", "**/*login*", "**/*session*", "**/*jwt*",
              "**/*oauth*", "**/*oidc*", "**/*saml*", "**/*permission*", "**/*rbac*",
              "**/*acl*", "**/*polic*", "**/*crypto*", "**/*secret*", "**/*password*",
              "**/middleware*", "**/*guard*", "**/*.env*", "**/Dockerfile*",
              "**/docker-compose*", "**/*.tf", "**/*.tfvars", "**/k8s/**", "**/helm/**",
              ".github/workflows/**", ".gitlab-ci.yml", "**/Jenkinsfile", "**/*rls*.sql"]
    - keywords: ["password", "passwd", "secret", "api_key", "apikey", "private_key",
                 "access_token", "refresh_token", "bearer", "jwt", "set-cookie", "httponly",
                 "samesite", "csrf", "cors", "encrypt", "decrypt", "hmac", "bcrypt", "argon2",
                 "innerhtml", "dangerouslysetinnerhtml", "eval(", "exec(", "shell=true",
                 "child_process", "os.system", "runtime.exec", "pickle.load", "yaml.load(",
                 "deserializ", "raw sql", "$queryraw", "from_sql", "row level security"]

  architecture_change:
    - paths: ["**/docker-compose*", "**/compose.y*ml", "**/Dockerfile*", "**/*.tf", "**/k8s/**",
              "**/helm/**", "**/kustomization.y*ml", "**/serverless.y*ml", "**/Procfile",
              ".github/workflows/**", ".gitlab-ci.yml", "**/Jenkinsfile",
              "**/*.proto", "**/*.graphql", "**/openapi*.y*ml", "**/openapi*.json",
              "**/asyncapi*.y*ml", "**/adr/**", "**/decisions/**"]
    - files_min: 25            # wide, cross-cutting changes

  dependency_change:
    paths: ["**/package.json", "**/package-lock.json", "**/pnpm-lock.yaml", "**/yarn.lock",
            "**/bun.lockb", "**/requirements*.txt", "**/pyproject.toml", "**/poetry.lock",
            "**/uv.lock", "**/Pipfile*", "**/go.mod", "**/go.sum", "**/Cargo.toml",
            "**/Cargo.lock", "**/pom.xml", "**/build.gradle*", "**/gradle.lockfile",
            "**/*.csproj", "**/packages.lock.json", "**/Directory.Packages.props",
            "**/Gemfile*", "**/composer.json", "**/composer.lock", "**/mix.exs",
            "**/mix.lock", "**/pubspec.yaml", "**/pubspec.lock", "**/Package.swift",
            "**/Package.resolved", "**/Podfile*"]

  perf_sensitive:
    - paths: ["**/*repo*", "**/*repositor*", "**/*dao*", "**/*quer*", "**/*cache*",
              "**/*worker*", "**/*job*", "**/*queue*", "**/*consumer*", "**/*batch*"]
    - added_lines: ['\b(SELECT|JOIN|GROUP BY|ORDER BY)\b',
                    '\.(findAll|findMany|find_all|filter|where|aggregate|annotate|prefetch_related|select_related|include)\(',
                    '\b(for|while)\b.*\b(await|fetch|query|get|request)\b']

# -----------------------------------------------------------------------------
# Routing — which review gates run for a diff (tech-lead runs in the PLAN phase,
# before a diff exists, so it is not routed here by default).
#   base:   first matching rule sets the initial gate list (size-driven);
#           `final: true` on a base rule skips add_if entirely
#   add_if: every matching rule appends gates (signal-driven)
#   stages: execution layout. Stages run one after another; the gates INSIDE a
#           stage are independent (none reads another's report) and may run
#           concurrently (orchestrator.max_parallel). Later stages read the
#           reports of earlier ones (qa-lead checks earlier findings were fixed).
# -----------------------------------------------------------------------------
routing:
  stages:
    - [ba, tech-lead, pm]
    - [architect, data-reviewer, code-reviewer, test-engineer, security-engineer, perf-engineer]
    - [qa-lead]
    - [smoke-tester]
    - [release-manager]

  base:
    - name: docs-only
      when: { signals: [docs_only] }
      agents: []
      final: true
    - name: trivial
      when: { loc_max: 15 }
      agents: []
    - name: small-change
      when: { loc_max: 150 }
      agents: [code-reviewer]
    - name: feature
      when: { loc_max: 1500 }
      agents: [code-reviewer, test-engineer, qa-lead]
    - name: large-change
      when: {}
      agents: [code-reviewer, test-engineer, qa-lead]

  add_if:
    - name: schema-or-data-model
      when: { signals: [schema_change] }
      agents_add: [data-reviewer, test-engineer]
    - name: api-surface
      when: { signals: [api_surface_change] }
      agents_add: [test-engineer, perf-engineer]
    - name: perf-sensitive-path
      when: { signals: [perf_sensitive], loc_min: 40 }
      agents_add: [perf-engineer]
    - name: security-sensitive
      when: { signals: [security_sensitive] }
      agents_add: [security-engineer]
    - name: dependency-change
      when: { signals: [dependency_change] }
      agents_add: [security-engineer]
    - name: architecture-change
      when: { signals: [architecture_change] }
      agents_add: [architect]
    - name: very-large-change
      when: { loc_min: 1500 }
      agents_add: [architect]
    - name: ui-change
      when: { signals: [ui_change], loc_min: 40 }
      agents_add: [smoke-tester]

# -----------------------------------------------------------------------------
# Orchestrator (headless runner). Engines are argv templates:
#   {tier}   → the engine's value for the role's tier (replaced inside any element)
#   {prompt} → optional whole element replaced by the prompt; WITHOUT it the
#              prompt is piped through stdin (preferred: no argv length limits,
#              and safe with variadic flags such as Claude's --allowedTools)
#   cmd      → used for read-only roles
#   cmd_run  → used for roles with `access: run` (smoke-tester); falls back to cmd.
#              Add your browser MCP tools to Claude's allow-list if you use one.
# -----------------------------------------------------------------------------
orchestrator:
  engine: claude
  base_ref: auto                 # auto → first existing ref in base_candidates; a component may set its own base_ref
  base_candidates: [origin/HEAD, origin/main, origin/master, main, master]
  include_uncommitted: true      # review the working tree, not just commits
  exclude_paths: [".omni-team/**"]   # vendored framework + run artifacts are not the project's code
  timeout_s: 1800
  artifact_max_kb: 40            # rotate runs/<task>/<role>.md beyond this size (0 = never); see docs/workflow.md
  max_parallel: 3                # gates of one stage run concurrently, at most this many; 1 = serial
  # Gate 0 — deterministic checks before any AI gate. Commands come from the
  # profile's `checks` list, or (checks: auto) from the lint/typecheck/test
  # commands of the touched components. Skipped when the snapshot already passed.
  run_checks: true
  checks_timeout_s: 900
  retry_budget:
    block_max: 3
    request_changes_max: 3
  engines:
    claude:
      cmd: ["claude", "-p", "--model", "{tier}", "--disallowedTools", "ReportFindings",
            "--allowedTools", "Read,Grep,Glob,Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(git status:*),Bash(ls:*)"]
      cmd_run: ["claude", "-p", "--model", "{tier}", "--disallowedTools", "ReportFindings",
                "--allowedTools", "Read,Grep,Glob,Bash,Write(.omni-team/runs/**)"]
      tiers: { deep: opus, standard: sonnet, fast: haiku }
    codex:
      cmd: ["codex", "exec", "--sandbox", "read-only",
            "-c", "model_reasoning_effort=\"{tier}\"", "-"]
      cmd_run: ["codex", "exec", "--sandbox", "workspace-write",
                "-c", "sandbox_workspace_write.network_access=true",
                "-c", "model_reasoning_effort=\"{tier}\"", "-"]
      tiers: { deep: high, standard: medium, fast: low }
