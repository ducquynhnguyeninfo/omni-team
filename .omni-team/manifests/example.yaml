# =============================================================================
# omni-team project manifest — example / reference
# =============================================================================
# This file is the SINGLE source of project-specific facts consumed by
# bootstrap.py to render the templates in ../templates/ into fully-resolved
# agent prompts at ../.claude/agents/.
#
# Keys are referenced from templates as {{path.to.key}}. *_md keys hold
# pre-rendered markdown that gets pasted in verbatim (multi-line OK).
# =============================================================================

project:
  name: Example Fullstack MVP
  short_name: example-mvp
  description: |
    Fullstack MVP with FastAPI + Postgres backend, Next.js 16 / pnpm-Turbo frontend,
    and Supabase Auth. Three portals: public website (MDX), customer portal, admin portal.

# What is the unit of work? (e.g. "Mini Package", "Ticket", "Story", "PR")
work_unit_label: Mini Package
work_unit_example_id: "MP-04A"

# Where specs live (passed to tech-lead / qa-lead)
spec_root: document/sprints/

# Where each agent's per-invocation output is appended. {mp_id} is substituted
# at orchestration time (the orchestrator handles the sprint number too).
artifact_dir: document/sprints/{sprint}/agent-pow/{mp_id}

# Used in qa-lead + ui-smoke-engineer to describe the human-owned step after them.
post_qa_lead_gate_label: Codex crosscheck

# Models per agent (Claude sub-agent frontmatter `model:` field)
models:
  tech_lead: opus
  backend_reviewer: sonnet
  frontend_reviewer: sonnet
  dba: sonnet
  qa_engineer: sonnet
  qa_lead: opus
  perf_engineer: sonnet
  security_engineer: sonnet
  ui_smoke_engineer: sonnet

# Project quality limits (referenced by frontend-reviewer rule 10)
quality_limits:
  file_lines: 500
  function_lines: 100
  function_params: 8
  nesting_depth: 4

# =============================================================================
# Backend stack
# =============================================================================
backend:
  framework: FastAPI
  language: python
  test_cmd: "ruff check . && ruff format --check . && pytest -q"
  dev_url: "http://localhost:8000"
  dev_port: 8000
  health_url: "http://localhost:8000/health"

  # Path layout (replace 'example' with your project name throughout)
  root: example-backend
  app_dir: example-backend/app/
  models_dir: example-backend/app/models/
  schemas_dir: example-backend/app/schemas/
  repos_dir: example-backend/app/repos/
  services_dir: example-backend/app/services/
  routers_dir: example-backend/app/routers/
  tests_dir: example-backend/tests/
  tests_glob: "example-backend/tests/test_*.py"
  entrypoint: example-backend/main.py
  generated_files_csv: "alembic versions, _auth_reflected.py"

  # Patterns used in rules
  db_query_patterns: "db.execute(...), select(, insert(, update(, delete("
  commit_call: "db.commit()"
  commit_exception: "Exception: standalone utility scripts under app/ are allowed to commit (rare)."
  forbidden_sort_pattern: "getattr(Model, sort_by)"

  # Error contract (rule 4 of backend-reviewer)
  error_contract:
    name: LeanApiError
    shape: '{"error_code": "...", "message": "..."}'
    location: "example-backend/app/schemas/api_error.py"

  # Soft-delete pattern (rule 5 of backend-reviewer, also referenced by dba/qa)
  soft_delete:
    mixin: SoftDeleteMixin
    column: deleted_at
    live_filter: ".where(<Model>.deleted_at.is_(None))"

  # Framework version idioms (rule 11)
  framework_version_idioms_md: |
    Pydantic v1 syntax: `class Config:`, `@validator`, `@root_validator`, `.parse_obj()`,
    `.dict()` — must be v2 equivalents (`model_config = ConfigDict(...)`, `@field_validator`,
    `@model_validator`, `.model_validate()`, `.model_dump()`).
    `Optional[X]` / `Union[X, Y]` in new code — prefer `X | None` and `X | Y`.

  # Layer rules (used by tech-lead)
  layer_rules_md: |
    - Layer order: `models → schemas → repos → services → routers → register in main.py`.
    - Flow direction: `router → service → repo`. Reverse forbidden.
    - Routers: HTTP parse → call service → return. No SQL, no business logic.
    - Services: business orchestration, commit txn. No HTTP, no SQL.
    - Repos: DB queries only. No commit, no business logic.

  # Async pitfalls (used by perf-engineer rule 10)
  async_pitfalls_md: |
    `requests.get` instead of `httpx.AsyncClient`, file I/O without `aiofiles`,
    blocking `time.sleep` in async paths.

# =============================================================================
# Frontend stack
# =============================================================================
frontend:
  framework: Next.js 16
  language: typescript
  test_cmd: "pnpm typecheck && pnpm lint"
  dev_url: "http://localhost:3000"
  stack_up_cmd: "/stack-up"

  # Path layout (replace 'example' with your project name)
  root: example-frontend
  app_dir: example-frontend/apps/web/
  components_dir: example-frontend/apps/web/components
  feature_module_path: "lib/<feature>/"
  hooks_pattern_path: "components/<portal>/<feature>/hooks/use-*.ts"
  wireframe_dir: example-frontend/wireframe-prototype

  # i18n
  locales: ["en", "vi", "fr"]
  locales_csv: "en/vi/fr"
  i18n_hook: useTranslations
  i18n_call: 't()'
  i18n_call_regex: 't\\("([^"]+)"\\)'
  locale_files_md: |
    - `example-frontend/apps/web/messages/en.json`
    - `example-frontend/apps/web/messages/vi.json`
    - `example-frontend/apps/web/messages/fr.json`

  # UI library
  ui_library: shadcn

  # Proxy
  proxy_helper: "apiGet / apiPost (or fetchViaProxy for RSC)"
  proxy_helper_path: "@/lib/admin"
  proxy_exceptions_md: |
    Exception: public intake flow may call backend directly per existing convention in `lib/intake/api.ts`.

  source_extensions_csv: ".tsx,.ts"
  generated_files_csv: "next-env.d.ts, .next/, tsconfig.tsbuildinfo"
  test_files_note: "(FE has no test runner by design)"

  # Browser MCP for ui-smoke-engineer
  browser_mcp: chrome_devtools
  browser_mcp_tools: >-
    mcp__chrome_devtools__new_page, mcp__chrome_devtools__navigate_page,
    mcp__chrome_devtools__select_page, mcp__chrome_devtools__close_page,
    mcp__chrome_devtools__list_pages, mcp__chrome_devtools__take_snapshot,
    mcp__chrome_devtools__take_screenshot, mcp__chrome_devtools__click,
    mcp__chrome_devtools__fill, mcp__chrome_devtools__fill_form,
    mcp__chrome_devtools__hover, mcp__chrome_devtools__press_key,
    mcp__chrome_devtools__wait_for, mcp__chrome_devtools__list_console_messages,
    mcp__chrome_devtools__get_console_message, mcp__chrome_devtools__evaluate_script,
    mcp__chrome_devtools__handle_dialog, mcp__chrome_devtools__resize_page

  # Admin-portal exemption — exact text in CLAUDE.md
  review_exemptions_md: |
    > **Admin-portal i18n exemption (project convention)**: existing admin views
    > (signal-master, trigger-rules, questionnaire, etc.) hardcode English strings —
    > they do NOT use `useTranslations`. When reviewing changes under `app/admin/`
    > or `components/admin/`, treat the i18n rule (#1, #2) as INFO/project-wide-WARNING
    > rather than per-MP CRITICAL. The i18n mandate applies fully to the public
    > `[locale]/(website)/` portal.

# =============================================================================
# Database
# =============================================================================
database:
  engine: postgres
  migrations:
    tool: alembic
    versions_dir: example-backend/alembic/versions/
    cmd_new: 'make migrate-new msg="..."'
    cmd_up: "make migrate-up"
    cmd_down: "make migrate-down"
    cmd_current: "make migrate-current"
    cmd_sql: "cd example-backend && make migrate-sql"

  soft_delete:
    partial_unique_clause_code: 'postgresql_where=text("deleted_at IS NULL")'

  rls:
    file: example-backend/scripts/rbac_public.sql

  # Vendor-managed schemas to NEVER touch in custom migrations
  vendor_owned_schemas_md: |
    `auth.*`, `storage.*`, `realtime.*` schemas are Supabase-owned; never reference
    them in custom migrations. `app/models/_auth_reflected.py` is the read-only
    reflection.

# =============================================================================
# LLM (only set llm.enabled=false to silence the perf-engineer LLM checks)
# =============================================================================
llm:
  enabled: true
  provider: OpenRouter (OpenAI-compatible)
  register_path_list: "_LLM_PATHS in main.py"
  prompt_template_location: "`prompt_templates` table in DB"
  slow_log_ms: 15000

# =============================================================================
# Cross-cutting conventions
# =============================================================================
conventions:
  idempotency:
    helper: "build_idempotency_key()"
    location: example-backend/app/services/idempotency.py

# =============================================================================
# Performance
# =============================================================================
performance:
  baseline_doc: example-backend/docs/PERFORMANCE_BASELINE.md
  cache_layer_helpers: "mapping_service for country / industry"
  tier_table_md: |
    | Tier | Threshold | Pattern |
    |------|-----------|---------|
    | A — LLM | ≤ 15,000 ms | Endpoints that call OpenRouter |
    | B — DB Complex | ≤ 500 ms | Multi-table JOINs, complex pagination |
    | C — DB Simple | ≤ 150 ms | Simple CRUD |
    | D — Lightweight | ≤ 50 ms | Cache hits, health check |

# =============================================================================
# Security
# =============================================================================
security:
  trigger_paths_md: |
    - `app/routers/auth*`, `app/services/auth*`, `app/core/jwt*`, `app/core/dependencies.py` changes
    - `apps/web/app/api/auth/`, `apps/web/middleware.ts`, `proxy.ts` changes
    - New or modified RLS policy in `scripts/rbac_public.sql`

  pii_fields_csv: "email, phone, address, password, payment, government ID"
  pii_log_keywords_csv: "`email`, `password`, `phone`, `name`, `address`, `token`, `jwt`, `cookie`"

  cookie_flags_required_csv: "HttpOnly + SameSite=Strict"
  cookie_prod_extra: ", and in production `Secure`"

  auth_guard_helpers: "`Depends(get_current_user_id)` or equivalent"

  pii_storage_pattern_md: |
    e.g. `email_normalised` + `email_hash` pattern in `session_actor`.

# =============================================================================
# Cross-cutting invariants — used by tech-lead's "Constraints to respect"
# =============================================================================
cross_cutting_invariants_md: |
  - **Soft-delete invariant**: every `SoftDeleteMixin` query filters `deleted_at.is_(None)`.
  - **LeanApiError**: every `HTTPException.detail` is `{error_code, message}`.
  - **i18n on FE**: every new user-visible string lands in all three `messages/{en,vi,fr}.json`.
  - **shadcn-only UI** on FE.
  - **Alembic-only schema changes** via `make migrate-new`.
  - **Idempotent side effects**: LLM/external/background tasks need idempotency keys
    (see `app/services/intake_service.py:build_idempotency_key`).
  - **Performance**: classify each new endpoint by tier
    (A LLM ≤15s / B complex ≤500ms / C simple ≤150ms / D lightweight ≤50ms).

# Design docs the tech-lead should consider reading (per-spec, selectively)
design_docs_list: |
  - `docs/ARCHITECTURE.md` — confirm domain model and system design.
  - `docs/SESSION_MODEL.md` — if the MP touches session/flow data.
  - `docs/AUTH_FLOW.md` — if the MP touches auth/cookies/proxy.
  - `<project>-db-schema` skill — if the MP requires new tables or columns.

# Phased plan template that tech-lead emits
phased_plan_template_md: |
  #### Phase 1 — Schema
  - [ ] `example-backend/app/models/<table>.py` — <change summary>
  - [ ] `example-backend/alembic/versions/` — generated via `make migrate-new msg="<msg>"`

  #### Phase 2 — DTOs
  - [ ] `example-backend/app/schemas/<domain>.py` — Create/Update/Response

  #### Phase 3 — Repo
  - [ ] `example-backend/app/repos/<table>_repo.py`

  #### Phase 4 — Service
  - [ ] `example-backend/app/services/<feature>_service.py`

  #### Phase 5 — Router
  - [ ] `example-backend/app/routers/<feature>.py`
  - [ ] Register in `example-backend/main.py`

  #### Phase 6 — Tests
  - [ ] `example-backend/tests/test_<feature>_repo.py`
  - [ ] `example-backend/tests/test_<feature>_service.py`

  #### Phase 7 — Frontend (if applicable)
  - [ ] `example-frontend/apps/web/lib/<feature>/api.ts` (or admin-api.ts)
  - [ ] `example-frontend/apps/web/components/<portal>/<feature>/...`
  - [ ] `example-frontend/apps/web/messages/{en,vi,fr}.json` — keys: <list>

# LLM-specific planning section (rendered into tech-lead output)
llm_specific_planning_md: |
  - LLM endpoint? → register path in `_LLM_PATHS` in `example-backend/main.py`
  - LLM call must use idempotency key from `conventions.idempotency.helper` on the wrapping handler.

# qa-lead specific frontend tests clause (FE has no runner here)
qa_lead:
  frontend_tests_clause: " (FE has no test runner by design — verify via manual exercise + ui-smoke-engineer)"

# =============================================================================
# Project-specific extra rules — appended per agent. Empty when not needed.
# These are the "lessons learned" that don't fit the universal template.
# =============================================================================
project_rules:
  backend_reviewer:
    critical_md: |
      - (none currently — universal CRITICAL list is exhaustive)
    warning_md: |
      - (none currently)

  frontend_reviewer:
    critical_md: |
      _Admin detail-panel header standard_ (per `example-frontend/docs/CODING_GUIDE.md`):
      detail-panel forms must place actions in the right side of the title row in this
      order — toggle (active flag), primary button, optional secondary, then destructive
      (edit mode only). Flag violations. Reference impl: check your repo's pattern.
    warning_md: |
      - **Inconsistent namespace for the same logical area**: e.g. `intake.submit` and
        `forms.submit_intake` referring to the same button across files. Pick one.
      - **Unused i18n key in any catalogue** (optional check; skip if scope >50 files).
      - **Wireframe drift**: if `example-frontend/wireframe-prototype/<feature>.tsx`
        exists for the area being reviewed, diff against it field-by-field.
        Exception: drifts explicitly justified in the spec are acceptable.

  dba:
    lessons_md: |
      > **FK dependency check**: when a revision proposes replacing a full
      > `UniqueConstraint` with a partial unique index, grep for any FK constraint
      > whose `REFERENCES <table>(<column>)` targets the column. Postgres FKs cannot
      > reference a partial unique index. If FKs exist, BLOCK and suggest alternatives.
    critical_md: |
      - (none beyond universal list)
    warning_md: |
      - (none beyond universal list)

  qa_engineer:
    p0_md: |
      - (none beyond universal P0 list)

  qa_lead:
    smoke_checks_md: |
      - **Wireframe parity (FE)**: if `example-frontend/wireframe-prototype/<feature>.tsx`
        exists, diff against the implemented component. Missing fields/labels here are
        MISSING in the verdict, even if not in the acceptance criteria.

  perf_engineer:
    rules_md: |
      - (none beyond universal list)

  security_engineer:
    rules_md: |
      - **Auth integration**: logout must call `signOut` AND clear cookies.
        Refresh-token rotation is mandatory on token refresh endpoints.

# =============================================================================
# Decision matrix — which agents fire for which change scope.
# Consumed by orchestrator.py classify().
#
# Rules: orchestrator picks the FIRST matching base rule, then ADDS agents
# from every matching `add_if` rule.
# =============================================================================
decision_matrix:
  base:
    - name: trivial
      when:
        loc_max: 20
      agents: []                              # /test-be or /test-fe only
    - name: bug-fix-be
      when:
        loc_max: 100
        stacks: ["backend"]
        schema_change: false
      agents: ["backend-reviewer"]
    - name: bug-fix-fe
      when:
        loc_max: 100
        stacks: ["frontend"]
      agents: ["frontend-reviewer"]
    - name: new-endpoint-existing-tables
      when:
        loc_max: 500
        stacks: ["backend"]
        new_route: true
        schema_change: false
      agents: ["qa-engineer", "backend-reviewer", "perf-engineer"]
    - name: new-table-plus-endpoint
      when:
        loc_max: 800
        stacks: ["backend"]
        schema_change: true
      agents: ["dba", "qa-engineer", "backend-reviewer", "perf-engineer"]
    - name: fullstack-mp
      when:
        loc_max: 999999
      agents: ["tech-lead", "qa-engineer", "backend-reviewer", "frontend-reviewer", "qa-lead"]

  add_if:
    - name: fe-touched-add-ui-smoke
      when:
        stacks: ["frontend"]
      agents_add: ["ui-smoke-engineer"]       # appears AFTER qa-lead
    - name: security-sensitive
      when:
        path_globs:
          - "**/auth*"
          - "**/jwt*"
          - "**/dependencies.py"
          - "apps/web/app/api/auth/**"
          - "apps/web/middleware.ts"
          - "scripts/rbac_public.sql"
        keywords: ["password", "token", "secret", "api_key", "cookie"]
        pii_fields: ["email", "phone", "address", "payment"]
      agents_add: ["security-engineer"]

# =============================================================================
# Orchestrator config
# =============================================================================
orchestrator:
  retry_budget:
    block_max: 3
    request_changes_max: 5

  # subprocess: spawn `claude -p` per agent (headless / CI)
  # inline:     emit invocation prompts for main Claude to call Agent() with
  spawn_mode: subprocess
  claude_cmd: claude

  # Where the orchestrator writes its own state
  state_file_pattern: document/sprints/{sprint}/agent-pow/{mp_id}/_state.json

  # Final human gate (orchestrator stops here, never automated)
  final_human_gate: "Codex crosscheck"
