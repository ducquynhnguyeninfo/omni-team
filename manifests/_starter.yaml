# -----------------------------------------------------------------------------
decision_matrix:
  base:
    - name: trivial
      when: { loc_max: 20 }
      agents: []
    - name: bug-fix-be
      when: { loc_max: 100, stacks: ["backend"], schema_change: false }
      agents: ["backend-reviewer"]
    - name: bug-fix-fe
      when: { loc_max: 100, stacks: ["frontend"] }
      agents: ["frontend-reviewer"]
    - name: new-endpoint
      when: { loc_max: 500, stacks: ["backend"], new_route: true }
      agents: ["qa-engineer", "backend-reviewer", "perf-engineer"]
    - name: schema-change
      when: { stacks: ["backend"], schema_change: true }
      agents: ["dba", "qa-engineer", "backend-reviewer", "perf-engineer"]
    - name: default-fullstack
      when: { loc_max: 999999 }
      agents: ["tech-lead", "qa-engineer", "backend-reviewer", "frontend-reviewer", "qa-lead"]

  add_if:
    - when: { stacks: ["frontend"] }
      agents_add: ["ui-smoke-engineer"]
    - when:
        path_globs: ["**/auth*", "**/jwt*"]
        keywords: ["password", "token", "secret", "api_key"]
      agents_add: ["security-engineer"]

# -----------------------------------------------------------------------------
orchestrator:
  retry_budget:
    block_max: 3
    request_changes_max: 5
  spawn_mode: subprocess
  claude_cmd: claude
  state_file_pattern: docs/specs/{mp_id}/agent-pow/_state.json
  final_human_gate: "manual QA + merge"
