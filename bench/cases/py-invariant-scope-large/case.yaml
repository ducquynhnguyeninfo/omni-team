id: py-invariant-scope-large
language: python
request: "Let suppliers create their own custom roles; role names become unique per scope instead of globally."
defects:
  - id: D1
    file: app/admin/access/policy.py
    lines: [1, 5]
    severity: critical
    summary: "Unchanged _role_id looks a role up by bare name; with per-scope names it can return a supplier's custom 'admin', so is_platform_admin / grant_platform_role resolve the wrong role — privilege escalation."
    keywords: ["_role_id", "policy.py", "is_platform_admin", "scope", "escalat", "bare name"]
    also:
      - {file: app/admin/access/policy.py, lines: [8, 21]}
  - id: D2
    file: scripts/seed/roles.sql
    lines: [2, 4]
    severity: critical
    summary: "Unchanged seed uses ON CONFLICT (name) but the migration dropped the unique constraint on name alone; Postgres rejects the statement, so every deploy's seed fails."
    keywords: ["ON CONFLICT", "seed", "roles.sql", "no unique", "conflict target"]
